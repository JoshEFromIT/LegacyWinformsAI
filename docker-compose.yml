services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # When running in Docker, reach Ollama on the host via host.docker.internal
      # Override in .env if Ollama runs in a different location
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Excalidraw MCP canvas server URL (Docker service name resolves internally)
      - EXCALIDRAW_CANVAS_URL=${EXCALIDRAW_CANVAS_URL:-http://excalidraw-canvas:3000}
    volumes:
      - ./sessions:/app/sessions
      - ./models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      excalidraw-canvas:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    restart: unless-stopped
    # GPU support (uncomment for NVIDIA GPU acceleration):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  excalidraw-canvas:
    image: ghcr.io/yctimlin/mcp_excalidraw-canvas:latest
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped

volumes:
  ollama_data:
